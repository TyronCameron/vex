baseURL = "https://tyroncameron.github.io/vex/"
languageCode = "en-GB"
title = "vex"
enableGitInfo = false

[module]
    [module.hugoVersion]
        extended = true
        min = "0.140.0"
    [[module.imports]]
        path = "github.com/colinwilson/lotusdocs"
    [[module.imports]]
        path = "github.com/gohugoio/hugo-mod-bootstrap-scss/v5"

[markup]
    [markup.tableOfContents]
        startLevel = 2
        endLevel = 3
    [markup.goldmark.renderer]
        unsafe = true
    [markup.goldmark.renderHooks.link]
        useEmbedded = "fallback"

[params]
    google_fonts = [
        ["Inter", "300, 400, 600, 700"],
        ["Fira Code", "500, 700"]
    ]
    sans_serif_font = "Inter"
    secondary_font = "Inter"
    mono_font = "Fira Code"

    [params.footer]
        copyright = "© :YEAR: Tyron Cameron. vex is open source under the [MIT licence](https://github.com/TyronCameron/vex/blob/main/LICENSE)."

    [params.social]
        github = "TyronCameron/vex"

    [params.docs]
        title = "vex"
        themeColor = "cyan"
        darkMode = true
        prism = true
        prismTheme = "vex"
        repoURL = "https://github.com/TyronCameron/vex"
        repoBranch = "main"
        sidebarIcons = true
        breadcrumbs = true
        backToTop = true
        toc = true
        tocMobile = true
        scrollSpy = true
        descriptions = false
        titleIcon = true
        navDesc = true
        navDescTrunc = 60
        listDescTrunc = 140
        intLinkTooltip = true

    [params.flexsearch]
        enabled = true

[menu]
    [[menu.primary]]
        name = "Docs"
        url = "docs/"
        identifier = "docs"
        weight = 10
    [[menu.primary]]
        name = "GitHub"
        url = "https://github.com/TyronCameron/vex"
        identifier = "github"
        weight = 20
