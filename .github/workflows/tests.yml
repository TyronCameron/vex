name: Tests

on:
  pull_request:

jobs:
  test:
    name: Unit + E2E tests + lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LuaJIT, busted, luacheck and just
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit luarocks lua5.1 liblua5.1-0-dev lua-check just
          sudo luarocks install busted

      - name: Ensure vex binary is executable
        run: chmod +x src/vex

      - name: Run tests
        run: just test

  bench:
    name: Benchmark (densely linked tasks)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LuaJIT and just
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit just

      - name: Ensure vex binary is executable
        run: chmod +x src/vex

      - name: Run benchmark
        run: just bench
